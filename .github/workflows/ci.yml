name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build the release tarball
        run: npm run release:tarball
      - name: Check the tarball
        run: |
          cd dist
          sha256sum -c paseo-multi-account-*.tgz.sha256
          test "$(tar tzf paseo-multi-account-*.tgz | cut -d/ -f1 | sort -u)" = paseo-multi-account
      - name: Install it into a headless Paseo daemon
        run: |
          npm install -g @getpaseo/cli@0.17.3 --no-audit --no-fund
          scripts/smoke-linux.sh dist/paseo-multi-account-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-multi-account-tarball
          path: dist/paseo-multi-account-*
          if-no-files-found: error
